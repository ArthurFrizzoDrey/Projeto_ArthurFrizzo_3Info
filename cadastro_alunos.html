<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <form name="contato" method= "post">
            <label for="Nome">Insira o seu nome completo:</label>
            <input type="text" name="Nome" size="20">
            <br>
            <label for="gmail">Insira o seu e-mail:</label>
            <input type="text" name="gmail" size="20">
            <br>
            <label for="senha">Insira a sua senha:</label>
            <input type="password" name="senha" size="20">
            <br>
            <label for="confirmacao_senha">Confirme a sua senha:</label>
            <input type="password" name="confirmacao_senha" size="20">
            <br>
            <label for="data">Insira a sua data de nascimento:</label>
            <input type="date" name="data" size="20">
            <label>Insira o seu gênero:</label><br>
            <input type="radio" name="genero" value="masculino"> Masculino<br>
            <input type="radio" name="genero" value="feminino"> Feminino<br>
            <label>
            <input type="checkbox" name="termos"> Aceito os termos de uso
            </label><br><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </form>
    </header>
</body>
