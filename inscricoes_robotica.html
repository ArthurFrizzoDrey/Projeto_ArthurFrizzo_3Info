<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <form method="post">
            <label>Nome completo:</label>
            <input type="text" name="nome"><br>

            <label>E-mail institucional:</label>
            <input type="email" name="email"><br>

            <label>Curso:</label>
            <input type="text" name="curso"><br>

            <label>Série/Ano:</label>
            <input type="text" name="serie"><br>

            <label>Modalidade:</label><br>
            <input type="radio" name="modalidade"> Olimpíada<br>
            <input type="radio" name="modalidade"> Projeto<br>

            <label>Nome da equipe:</label>
            <input type="text" name="equipe"><br>

            <label>Quantidade de integrantes:</label>
            <input type="number" name="quantidade"><br>

            <label>Lista de integrantes:</label><br>
            <textarea name="lista"></textarea><br>

            <label>Precisa de equipamentos?</label><br>
            <input type="radio" name="equip"> Sim<br>
            <input type="radio" name="equip"> Não<br>

            <label>Proposta do projeto:</label>
            <input type="file"><br>

            <label>
            <input type="checkbox"> Aceito o regulamento
            </label><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </header>
</body>
</html>
